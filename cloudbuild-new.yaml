steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/crdb-settings/crdb-settings:${BUILD_ID}
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/crdb-settings/crdb-settings:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/crdb-settings/crdb-settings
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/crdb-settings/crdb-settings
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
